[package]
name = "chgpf"
version = "1.2.0"
edition = "2024"
description = "A simple command-line tool to change Git profiles"
authors = ["Daniel Kulichkov <danchick03@gmail.com>"]
license = "MIT"
repository = "https://github.com/kulichkoff/chgpf"
keywords = ["git", "profile", "command-line"]
categories = ["command-line-utilities"]

[profile.release]
lto = true
opt-level = "s"
panic = "abort"

[dependencies]
bpaf = "0.9.25"
thiserror = "1"
serde = { version = "1.0", default-features = false, features = ["derive"] }
toml = { version = "0.8.19", default-features = false, features = ["parse", "display"] }
anyhow = "1.0.102"

[dev-dependencies]
tempfile = "3"
